name: Push image to GHCR

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        go-version: ["1.26"]
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build -o lidl-coupons main.go
      - name: chmod +x
        run: chmod +x lidl-coupons
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute Docker tags
        id: tags
        run: |
          BASE="ghcr.io/${{ github.repository_owner }}/lidl-coupons"
          REF="${{ github.ref_name }}"
          if [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            git fetch --tags --force
            echo "version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
            TAGS="${BASE}:${MAJOR}.${MINOR}.${PATCH}"
            # Is there a tag v{MAJOR}.{MINOR}.X with X > PATCH?
            NEWER_PATCH=$(git tag -l "v${MAJOR}.${MINOR}.*" \
              | sed -nE "s/^v${MAJOR}\.${MINOR}\.([0-9]+)$/\1/p" \
              | sort -n | awk -v p="$PATCH" '$1 > p' | head -1)
            if [[ -z "$NEWER_PATCH" ]]; then
              TAGS="${TAGS},${BASE}:${MAJOR}.${MINOR}"
              # Is there a tag v{MAJOR}.X.Y with X > MINOR?
              NEWER_MINOR=$(git tag -l "v${MAJOR}.*.*" \
                | sed -nE "s/^v${MAJOR}\.([0-9]+)\.[0-9]+$/\1/p" \
                | sort -n | awk -v m="$MINOR" '$1 > m' | head -1)
              if [[ -z "$NEWER_MINOR" ]]; then
                TAGS="${TAGS},${BASE}:${MAJOR}"
                # Is there a tag v{MAJOR+1...}.X.Y with a higher major?
                NEWER_MAJOR=$(git tag -l "v*.*.*" \
                  | sed -nE "s/^v([0-9]+)\.[0-9]+\.[0-9]+$/\1/p" \
                  | sort -n | awk -v M="$MAJOR" '$1 > M' | head -1)
                if [[ -z "$NEWER_MAJOR" ]]; then
                  TAGS="${TAGS},${BASE}:latest"
                fi
              fi
            fi
          else
            TAGS="${BASE}:${REF}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/lidl-coupons:${{ steps.tags.outputs.version }}"
          gh release create "${{ github.ref_name }}" \
            "lidl-coupons#lidl-coupons-linux-amd64" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "Docker image: \`${IMAGE}\`"

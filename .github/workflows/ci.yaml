name: CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches-ignore: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Install dependencies
        run: go mod download
      - name: go vet
        run: go vet .
      - name: go fmt
        run: gofmt -d .
      - name: go build
        run: go build -o lidl-coupons main.go
      - name: go test
        run: go test .
